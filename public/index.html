<!doctype html>

<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Oh No! More Snake</title>
	<meta name="description" content="Omasnake in a browser: levels, a snake eater, and a Party Mode that reads the music it is playing.">
	<meta name="color-scheme" content="dark light">
	<link rel="icon" href="snake/omasnake.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
	<style>
		:root {
			/* Overwritten by web.js from the selected theme, so the page and the
			   board always agree. These are the tokyo-night defaults, present so
			   nothing flashes white before the first paint. */
			--bg: #1a1b26;
			--fg: #c0caf5;
			--accent: #7aa2f7;
			--muted: #565f89;
			--selection: #33467c;
			--play-area: #16161e;
			--trough: #131420;
			--combo-trough: #3b3f56;
			--button-hover: #86aaf6;
			--button-active: #61809c;
			--button-border: #8fabf5;

			/* The board is a whole number of pixels per cell, so its width is one
			   of a handful of values rather than the viewport's. web.js sets this
			   to whichever it picked, and the meters line up with the board
			   instead of drifting a few pixels wider. */
			--board-w: 440px;

			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
		}

		body {
			height: 100svh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
			padding: 20px 16px;
			background: var(--bg);
			color: var(--fg);
			font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 14px;
			transition: background-color 160ms linear, color 160ms linear;
			overflow: hidden;
			touch-action: none;
			-webkit-text-size-adjust: 100%;
		}

		h1 {
			margin: 0;
			font-size: 22px;
			font-weight: 700;
			letter-spacing: 0.06em;
			text-align: center;
		}

		.sub {
			margin: 0;
			max-width: 56ch;
			font-size: 12px;
			line-height: 1.7;
			color: var(--muted);
			text-align: center;
			text-wrap: balance;
		}

		/* Everything inside #stage is the game; everything outside it is the
		   page around the game. That is the whole of the fullscreen feature —
		   the browser renders only the fullscreen element's subtree, so the
		   title and the blurb go without a single rule hiding them. */
		#stage {
			width: 100%;
			max-width: 900px;
			min-height: 0;
			flex: 1 1 auto;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
		}

		/* The two strips that read as part of the board are aligned to it. The
		   board's own frame is not, because it is the thing being measured to
		   decide that width — and neither are the controls, because where they
		   wrap decides how much height is left for the board, and a width that
		   depends on the board would make that circular. */
		#head,
		#meters {
			width: 100%;
			max-width: var(--board-w);
		}

		#controls {
			width: 100%;
		}

		/* The fullscreen element gets a transparent backdrop by default, which
		   in practice means black — a shade no palette here is using. */
		#stage:fullscreen,
		#stage.faux {
			background: var(--bg);
			padding: 16px;
			max-width: none;
		}

		/* iOS Safari has no Element.requestFullscreen at all, and a URL
		   parameter can never drive the real one, so the same look is
		   available as plain CSS. */
		#stage.faux {
			position: fixed;
			inset: 0;
			z-index: 50;
			width: auto;
		}

		#head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 12px;
		}

		#level {
			font-size: 22px;
			font-weight: 700;
			letter-spacing: 0.02em;
		}

		#score {
			font-weight: 700;
			color: var(--muted);
		}

		/* The meters occupy a fixed strip whether or not anything is in it, so
		   turning Party Mode on does not shift the board up the page. */
		#meters {
			position: relative;
			height: 18px;
			transition: height 160ms ease;
		}

		body.party #meters {
			height: 36px;
		}

		.bar {
			position: absolute;
			left: 0;
			right: 0;
			height: 5px;
			border-radius: 3px;
			overflow: hidden;
		}

		.bar > span {
			display: block;
			height: 100%;
			border-radius: 3px;
			background: var(--accent);
		}

		/* On a boss level the bar is not progress any more, it is the boss. */
		#level-progress.boss > span {
			background: #f7768e;
		}

		#level-progress {
			top: 50%;
			margin-top: -2.5px;
			background: var(--trough);
			transition: top 160ms ease, margin-top 160ms ease;
		}

		body.party #level-progress {
			top: 2px;
			margin-top: 0;
		}

		#level-progress > span {
			transition: width 140ms linear;
		}

		#combo {
			top: 29px;
			background: var(--combo-trough);
		}

		#combo > span {
			transition: width 50ms linear;
		}

		#combo-name {
			position: absolute;
			right: 0;
			top: 8px;
			font-size: 12px;
			font-weight: 700;
			color: var(--accent);
		}

		#elapsed {
			position: absolute;
			left: 0;
			right: 0;
			top: 1px;
			text-align: center;
			color: var(--muted);
		}

		[hidden] {
			display: none !important;
		}

		/* The frame takes whatever height the rest of the column leaves, and the
		   canvas is centred inside it without contributing any height of its
		   own. That is what lets resize() ask "how much room is left?" instead
		   of adding up its siblings — and it is why fullscreen needs no special
		   arithmetic. */
		#board-frame {
			position: relative;
			flex: 1 1 auto;
			min-height: 0;
			width: 100%;
		}

		#board {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			display: block;
			touch-action: none;
			cursor: pointer;
		}

		#controls {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
		}

		.row {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
		}

		button {
			height: 38px;
			padding: 0 14px;
			border-radius: 10px;
			border: 1px solid var(--button-border);
			/* Accent is mandatory in an Omarchy theme. Using it directly avoids
			   optional palette entries turning these black on a light theme. */
			background: var(--accent);
			color: var(--bg);
			font-family: inherit;
			font-size: 13px;
			line-height: 1;
			cursor: pointer;
			transition: background-color 90ms linear;
		}

		button:hover {
			background: var(--button-hover);
		}

		button:active {
			background: var(--button-active);
		}

		button:focus-visible {
			outline: 2px solid var(--fg);
			outline-offset: 2px;
		}

		/* The shortcut is shown by bolding the letter and nothing else. The Qt
		   build also recolours it to the foreground, which on a light theme puts
		   dark text on an accent-coloured button and loses the letter — weight
		   alone reads on every palette. */
		button b {
			font-weight: 700;
		}

		dialog {
			width: min(92vw, 460px);
			max-height: 82svh;
			padding: 0;
			border: 1px solid var(--button-border);
			border-radius: 14px;
			background: var(--bg);
			color: var(--fg);
			font-family: inherit;
			overflow: hidden;
		}

		dialog::backdrop {
			background: rgb(0 0 0 / 0.62);
		}

		.charts-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 14px 16px 10px;
		}

		.charts-head h2 {
			margin: 0;
			font-size: 17px;
			font-weight: 700;
			letter-spacing: 0.06em;
		}

		#charts-close {
			height: 28px;
			padding: 0 10px;
			border-radius: 8px;
		}

		.tabs {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			padding: 0 16px 12px;
		}

		.tab {
			height: 28px;
			padding: 0 10px;
			font-size: 12px;
			border-radius: 8px;
			background: transparent;
			border-color: var(--muted);
			color: var(--muted);
		}

		.tab:hover {
			background: var(--combo-trough);
			color: var(--fg);
		}

		.tab[aria-selected="true"] {
			background: var(--accent);
			border-color: var(--button-border);
			color: var(--bg);
		}

		#charts-list {
			margin: 0;
			padding: 0 16px;
			max-height: 46svh;
			overflow-y: auto;
			list-style: none;
		}

		#charts-list li {
			display: grid;
			grid-template-columns: 2.2em 1fr auto;
			align-items: baseline;
			gap: 10px;
			padding: 7px 0;
			border-top: 1px solid var(--combo-trough);
		}

		#charts-list li:first-child {
			border-top: 0;
		}

		.rank {
			color: var(--muted);
			font-size: 12px;
		}

		.score {
			font-weight: 700;
		}

		.run {
			color: var(--muted);
			font-size: 12px;
		}

		.when {
			color: var(--muted);
			font-size: 11px;
			text-align: right;
		}

		/* The run you just finished, so it can be picked out of the list. */
		#charts-list li.mine .score,
		#charts-list li.mine .rank {
			color: var(--accent);
		}

		#charts-note {
			margin: 0;
			padding: 12px 16px 14px;
			font-size: 11px;
			line-height: 1.6;
			color: var(--muted);
		}

		/* Full-page, above everything, and never in the way of a click. */
		#splash {
			position: fixed;
			inset: 0;
			z-index: 100;
			pointer-events: none;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			margin: -1px;
			padding: 0;
			overflow: hidden;
			clip-path: inset(50%);
			white-space: nowrap;
		}

		/* On a short screen the blurb is the first thing to go: the board is
		   what the page is for. */
		@media (max-height: 640px) {
			body {
				padding: 8px;
				gap: 8px;
			}

			h1,
			.sub {
				display: none;
			}
		}
	</style>
</head>

<body>

	<h1>Oh No! More Snake</h1>

	<p class="sub">
		Drop your own music on the page. Party Mode listens to whatever is playing
		and paints the board with it.
	</p>

	<main id="stage">
		<div id="head">
			<div id="level">LEVEL 1</div>
			<div id="score">SCORE 0</div>
		</div>

		<div id="meters">
			<div class="bar" id="level-progress"><span id="level-progress-fill"></span></div>
			<div class="bar" id="combo" hidden><span id="combo-fill"></span></div>
			<div id="combo-name" hidden></div>
			<div id="elapsed" hidden>00:00</div>
		</div>

		<div id="board-frame">
			<canvas id="board" width="440" height="320" aria-label="Snake board"></canvas>
		</div>

		<div id="controls">
			<div class="row">
				<button type="button" id="mode"></button>
				<button type="button" id="borders"></button>
				<button type="button" id="food"></button>
				<button type="button" id="charts-open"></button>
			</div>
			<div class="row">
				<button type="button" id="party"></button>
				<button type="button" id="next"></button>
				<button type="button" id="theme"></button>
				<button type="button" id="view"></button>
			</div>
		</div>

		<!-- Inside the stage, or fullscreen would render none of them: only the
		     fullscreen element's own subtree is drawn. -->
		<dialog id="charts" aria-labelledby="charts-title">
			<div class="charts-head">
				<h2 id="charts-title">CHARTS</h2>
				<button type="button" id="charts-close" aria-label="Close charts">✕</button>
			</div>
			<div class="tabs" role="tablist" aria-label="Chart period">
				<button type="button" class="tab" role="tab" data-period="day">24 hours</button>
				<button type="button" class="tab" role="tab" data-period="week">7 days</button>
				<button type="button" class="tab" role="tab" data-period="month">30 days</button>
				<button type="button" class="tab" role="tab" data-period="all">All time</button>
			</div>
			<ol id="charts-list"></ol>
			<p id="charts-note"></p>
		</dialog>

		<canvas id="splash" hidden></canvas>
		<p id="status" class="sr-only" role="status" aria-live="polite"></p>
	</main>

	<noscript>
		<p>Oh No! More Snake needs JavaScript. It is one page of it, and no trackers.</p>
	</noscript>

	<script type="module" src="snake/web.js"></script>

</body>

</html>
